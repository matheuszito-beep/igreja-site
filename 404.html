<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — 1ª Igreja Batista Maanaim</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: #fff;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .code {
      margin: 0;
      font-size: clamp(6rem, 3rem + 14vw, 12rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.06em;
      background: linear-gradient(90deg, #ff7a18, #ff3d77 45%, #8f5bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 1rem 0 0; font-size: clamp(1.5rem, 1rem + 2vw, 2.25rem); font-weight: 600; letter-spacing: -0.03em; }
    p { margin: 0.75rem auto 0; max-width: 36ch; color: #6e6e73; font-size: 1.0625rem; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem 1.5rem; margin-top: 2rem; }
    a { color: #0066cc; font-size: 1.0625rem; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn { padding: 0.7rem 1.4rem; border-radius: 999px; background: #0071e3; color: #fff; }
    .btn:hover { background: #0077ed; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página não existe.</h1>
    <p>O endereço pode ter mudado ou foi digitado errado. Mas a porta da igreja continua aberta.</p>
    <div class="actions">
      <a class="btn" href="/">Voltar ao início</a>
      <a href="/eventos.html">Ver agenda</a>
    </div>
  </main>
</body>
</html>
